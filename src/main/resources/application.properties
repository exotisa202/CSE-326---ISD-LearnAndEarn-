# Local development defaults. Use demo profile for an in-memory, synthetic demo.
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/learnandearn}
spring.datasource.username=${DB_USER:learnandearn}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
app.remote-seeding.enabled=false
spring.devtools.restart.enabled=false
